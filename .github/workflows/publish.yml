name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Trusted publishing needs npm >= 11.5.1; node 22 ships npm 10 and fails with ENEEDAUTH.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Run tests
        run: bun test

      - name: Build check
        run: bun build tui.tsx --target=node --external '*' --outdir=/tmp/build

      # The tag is the release: refuse to publish a version the code does not declare.
      - name: Check tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow from a tag, not from ${GITHUB_REF_NAME}"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      # Trusted publishing only: npm exchanges the GitHub OIDC token for a
      # short-lived publish credential. No long-lived npm token is stored.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || echo "release $GITHUB_REF_NAME already exists"
